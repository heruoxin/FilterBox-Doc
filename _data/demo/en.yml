rules:
  actions:
    dismiss: Dismiss
    mute: Mute
    snooze: Snooze
    replace: Replace
    sound: Change sound
    tts: Read out
    call: Call style notify
    tap: Tap button
    open: Open
    webhook: Webhook
  descs:
    dismiss: Dismiss the notification
    mute: Mute the phone for 5 seconds
    snooze: Snooze to the specified time
    replace: Hide sensitive info from the content
    sound: Play a custom ringtone
    tts: Read out the notification
    call: Repost it as an incoming call
    tap: Tap buttons such as Mark as read
    open: Open the notification directly
    webhook: Send the content as JSON to your URL
  scenarios:
    dismiss:
      n: { app: shoploop, title: "⚡ Flash sale: 70% off", text: Ends at midnight. Tap to claim your coupon! }
    mute:
      n: { app: crew, title: "Jordan in #general", text: Anyone up for a quick call? }
    snooze:
      n: { app: newsdrop, title: Morning briefing, text: "Markets, weather and your top 5 stories" }
      until: "18:00"
    replace:
      n: { app: bank, title: Transfer received, text: "$1,250.00 from Alex Kim" }
      replaced: { title: Bluewhale Bank, text: You have a new notification }
    sound:
      n: { app: chirp, title: Mom, text: "Call me when you're free ❤️" }
    tts:
      n: { app: parcelo, title: Arriving soon, text: Your parcel is 2 stops away. }
      speech: "Notification from Parcelo. Arriving soon. Your parcel is 2 stops away."
    call:
      n: { app: crew, title: Dana, text: "Urgent: can you join the client call?" }
      answer: Open
      decline: Dismiss
    tap:
      button: Mark as read
      buttons: [Reply, Mark as read]
      n: { app: messages, title: "72015", text: "Weekend promo: free delivery on all orders. Reply STOP to opt out" }
    open:
      n: { app: yumm, title: Your rider has arrived, text: "Meet Chris at the lobby · Code 2846" }
      screen: { title: Order arrived, text: "Meet Chris at the lobby", code: "2846" }
    webhook:
      n: { app: messages, title: "+1 650 555 0134", text: Your Nimbus code is 482913. }
      host: example.com

