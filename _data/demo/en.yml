rules:
  labels:
    name: Rule
    apps: From
    keywords: Contains any
    time: Time
    all_day: All day
    then: Then
    test: Run test
    result: "Matches {n} notifications in your history"
    sound: Sound
    sound_on: "On"
    sound_off: "Off"
  actions:
    dismiss: Dismiss
    mute: Mute
    snooze: Snooze
    replace: Replace
    sound: Change sound
    tts: Read out
    call: Call style
    tap: Tap button
    open: Open
    webhook: Webhook
  scenarios:
    dismiss:
      name: Silence promos
      apps: [shoploop]
      keywords: [sale, coupon, "% off"]
      n: { app: shoploop, title: "⚡ Flash sale: 70% off", text: Ends at midnight. Tap to claim your coupon! }
      result: Dismissed by rule “Silence promos”
      hits: 126
    mute:
      name: Quiet work chat after 7 pm
      apps: [crew]
      time: "19:00 – 09:00"
      n: { app: crew, title: "Jordan in #general", text: Anyone up for a quick call? }
      result: Muted — no sound, no vibration
      hits: 58
    snooze:
      name: News after work
      apps: [newsdrop]
      time: "09:00 – 18:00"
      n: { app: newsdrop, title: Morning briefing, text: "Markets, weather and your top 5 stories" }
      result: Snoozed until 18:00
      hits: 214
    replace:
      name: Hide balances in public
      apps: [bank]
      n: { app: bank, title: Transfer received, text: "$1,250.00 from Alex Kim" }
      replaced: { title: Bluewhale Bank, text: You have a new notification }
      result: Content replaced
      hits: 37
    sound:
      name: Mom's ringtone
      apps: [chirp]
      keywords: [Mom]
      n: { app: chirp, title: Mom, text: "Call me when you're free ❤️" }
      result: "Playing ringtone: Marimba"
      hits: 41
    tts:
      name: Read deliveries aloud
      apps: [parcelo]
      n: { app: parcelo, title: Arriving soon, text: Your parcel is 2 stops away. }
      speech: "Notification from Parcelo. Arriving soon. Your parcel is 2 stops away."
      result: Reading aloud…
      hits: 23
    call:
      name: Never miss the boss
      apps: [crew]
      keywords: [urgent]
      n: { app: crew, title: Dana, text: "Urgent: can you join the client call?" }
      answer: Open
      decline: Dismiss
      result: Ringing like an incoming call
      hits: 6
    tap:
      name: Auto “Mark as read”
      apps: [messages]
      keywords: [STOP]
      button: Mark as read
      buttons: [Reply, Mark as read]
      n: { app: messages, title: "72015", text: "Weekend promo: free delivery on all orders. Reply STOP to opt out" }
      result: Tapped “Mark as read”
      hits: 88
    open:
      name: Open when the rider arrives
      apps: [yumm]
      keywords: [arrived]
      n: { app: yumm, title: Your rider has arrived, text: "Meet Chris at the lobby · Code 2846" }
      screen: { title: Order arrived, text: "Meet Chris at the lobby", code: "2846" }
      result: Opened automatically
      hits: 12
    webhook:
      name: Forward codes to my server
      keywords: [code]
      n: { app: messages, title: "+1 650 555 0134", text: Your Nimbus code is 482913. }
      url: https://example.com/hook
      result: "POST sent · 200 OK"
      hits: 64

