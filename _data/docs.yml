# Help center registry. `paths` are source files; a doc's URL is its path without `.md`.
# Navigation labels and meta descriptions live in _data/i18n/<lang>.yml under `docs.<key>`.
# A language missing from `paths` falls back to the English doc, then to any other language.
items:
  - key: faq
    paths: { en: FAQ.md, zh-Hans: 帮助.md, zh-Hant: zh-Hant/faq.md, ja: ja/faq.md }
  - key: purchase
    paths: { en: purchase.md, zh-Hans: 购买说明.md, zh-Hant: zh-Hant/purchase.md, ja: ja/purchase.md }
  - key: advanced
    paths: { en: advanced_filter_rule_guide.md, zh-Hans: 高级过滤规则指南.md, zh-Hant: zh-Hant/advanced-filter-rules.md, ja: ja/advanced-filter-rules.md }
  - key: webhook
    paths: { en: webhook_rule_guide.md, zh-Hans: Webhook_功能指南.md, zh-Hant: zh-Hant/webhook.md, ja: ja/webhook.md }
  - key: changelog
    paths: { en: changelog.md, zh-Hans: 更新记录.md }
  - key: privacy
    paths: { zh-Hans: 隐私政策.md }
  - key: licenses
    paths: { en: licenses.md }
  - key: reseller
    hidden: true
    paths: { zh-Hans: resellers/数码荔枝.md }
  - key: bubble
    hidden: true
    paths: { en: ai_bubble_privacy.md }
