home:
  hero:
    badge: Android のための通知マネージャー
    title: ["邪魔な通知はカット。", "大事な通知は逃さない。"]
    intro: FilterBox はすべての通知を検索できる履歴に残し、オフラインAIで迷惑通知や広告を静かに。あとはあなたのルールにおまかせです。
    hint: 試してみよう：通知をスワイプして消す
  history:
    eyebrow: 通知履歴
    title: ["うっかり消しても、", "履歴にちゃんと残る。"]
    intro: すべての通知を端末内に暗号化して保存。アプリやキーワードで検索し、タイムラインでさかのぼって、必要な通知はすぐに復元できます。あとから削除・送信取り消しされたメッセージも確認できます。
    points:
      - アプリ・キーワード・種類・ルールで検索
      - タイムラインで過去の日時へジャンプ
      - うっかり消した通知を復元
      - CSV で書き出して Excel などで分析
    hint: 右のタイムラインをドラッグ、または通知をタップ
  rules:
    eyebrow: カスタムルール
    title: ["ルールを決めれば、", "あとは自動で。"]
    intro: アプリ、キーワード、時間帯、端末の状態を選んで、どう処理するかを決めるだけ。宣伝通知は消す、仕事のチャットは夜だけミュート、家族からの連絡は着信のように鳴らす、配達の通知は読み上げる。
    pick: ルールの動作を選ぶ
    community: アイデアが欲しいときは、みんなが共有したルールをどうぞ
  ai:
    eyebrow: オフラインAIフィルター
    title: ["何が迷惑かは、", "あなたが決める。"]
    intro: すべての通知を端末上でリアルタイムに判定し、内容はどこにも送信しません。「スパムです」「正常です」と教えるだけで、スマホの待機中や充電中にこっそり学習して、使うほどあなた好みに。フィルターの強さはスライダーひとつで調整できます。
    points:
      - 完全オフライン、端末内で動作
      - マークした通知から学習
      - しきい値と対象アプリは自由に設定
    note: AI フィルターには Android 10 以上、メモリ 6 GB 超の端末が必要です。
  enhancers:
    eyebrow: 便利機能
    title: ["小さな機能が、", "毎日をラクに。"]
    intro: 必要なものだけオンに。どれも日々のちょっとしたストレスを解消します。
    cards:
      recall:
        title: 消去の取り消し
        text: うっかり通知をスワイプしても大丈夫。5 秒間「元に戻す」ボタンが表示されます。
      shh:
        title: スマートミュート
        text: 同じアプリから短時間に通知が続くと、しばらく自動でミュート。盛り上がるグループチャットもこれで静かに。
      captcha:
        title: 認証コードのコピー
        text: SMS やほかのアプリの認証コード通知に「コピー」ボタンを追加。スマホに標準機能がなくても安心です。
      webhook:
        title: Webhook
        text: 条件に合う通知を JSON 形式で、自分のサーバーやチャットボット、スマートホームに転送します。
    more: "ほかにも：ホーム画面ウィジェット · 指紋／顔認証ロック · テーマ · ルールのインポート／エクスポート · アプリの除外"
  analytics:
    eyebrow: 通知の分析
    title: ["通知が多いアプリが、", "ひと目でわかる。"]
    intro: 直近の概要と日別のグラフで、どのアプリがよく通知してくるか、FilterBox がどれだけフィルタしたかを確認。次に対策すべきアプリが見えてきます。
  privacy:
    eyebrow: プライバシー
    title: ["あなたの通知は、", "あなたのスマホの中だけに。"]
    items:
      - title: 端末内で暗号化保存
        text: 通知履歴は端末内にのみ保存され、アップロードされることはありません。
      - title: オフラインで動く AI
        text: 判定も学習も、すべて端末内で完結します。
      - title: 指紋・顔認証ロック
        text: 通知履歴は、あなただけが見られます。
      - title: 通信は最小限
        text: 購入の確認と、オフにできるクラッシュレポートのみです。
  pricing:
    eyebrow: 料金
    title: ["無料ではじめて、", "必要なときに Pro へ。"]
    intro: 初めてインストールすると、Pro のすべての機能を無料でお試しいただけます。
    free:
      name: 無料
      price: ¥0
      note: 基本機能はずっと無料
      features:
        - 通知履歴
        - 検索・タイムライン・復元
        - Pro 全機能の無料トライアル
    pro:
      name: Pro
      price: 買い切り
      note: すべての機能を、ずっと
      badge: おすすめ
      features:
        - カスタムルールとすべての動作
        - オフラインAI 迷惑通知フィルター
        - 消去の取り消し・スマートミュート・Webhook
        - 通知の分析と CSV 書き出し
        - より長い履歴の保存
        - 今後の新機能も追加料金なし
    notes:
      - Google Play：一度購入すればずっと使えます。同じ Google アカウントの端末すべてで利用可能です。
      - 中国本土版：Alipay・WeChat Pay で、サブスクリプションまたは買い切りを購入できます。
      - 購入から 48 時間以内なら返金できます。
    more: 購入について詳しく
  faq:
    title: ["気になること、", "お答えします。"]
    more: ヘルプセンターへ
    items:
      - q: FilterBox は無料ですか？
        a: 無料でダウンロードでき、通知履歴はずっと無料で使えます。初めてインストールすると Pro の全機能を無料でお試しいただけます。トライアル終了後、カスタムルール、AIフィルター、便利機能などの Pro 機能には Pro の購入が必要です。
      - q: 通知の内容がアップロードされることはありますか？
        a: ありません。通知履歴は端末内で暗号化して保存され、AIフィルターも完全にオフラインで動作します。FilterBox が通信するのは購入の確認と、許可した場合のクラッシュレポートの送信だけで、クラッシュレポートは設定でオフにできます。
      - q: うっかり消した通知や、送信取り消しされたメッセージは見られますか？
        a: はい。FilterBox は通知が届いた時点で内容を保存するため、通知をスワイプして消したり、相手がメッセージを削除・送信取り消ししたりしても、元の通知は履歴に残ります。確認できるのは、通知に表示された内容だけです。
      - q: AI 迷惑通知フィルターはどうやって学習しますか？
        a: すべての通知に、端末上でスパムスコアが付けられます。通知を開いて「スパムです」または「正常です」をタップすると、スマホの待機中や充電中にそれを学習します。フィルターのしきい値（標準は 80%）や対象アプリも設定できます。AI フィルターには Android 10 以上、メモリ 6 GB 超の端末が必要です。
      - q: しばらくすると FilterBox が動かなくなります。
        a: スマホのバッテリー管理機能が、FilterBox をバックグラウンドで停止している可能性があります。バックグラウンドでの実行と自動起動を許可し、バッテリーの最適化をオフにしてください。メーカーごとの設定方法は dontkillmyapp.com が参考になります。
      - q: 一部の通知の内容が「非表示」になっています。
        a: "Android 15 以降、ワンタイムコードを含む可能性がある通知は、システムによってサードパーティのアプリから隠されます。「設定 → 通知 → 拡張通知」をオフにするか、ADB で次のコマンドを実行してください：adb shell appops set com.catchingnow.np RECEIVE_SENSITIVE_NOTIFICATIONS allow"
      - q: スワイプで消せない常駐通知も消せますか？
        a: はい、Android 8.0 以降で可能です。ルールの「消去」動作で「常駐通知を含む」をオンにしてください。一部の端末では、システム設定で通知のスヌーズを許可する必要があります。
      - q: APK を直接インストールしたら、通知へのアクセスを許可できません。
        a: Android 13 以降では、ストア以外からインストールしたアプリに制限がかかります。「設定 → アプリ → FilterBox」を開き、右上のメニューから「制限付き設定を許可」を選んでから、もう一度通知へのアクセスを許可してください。
  closing:
    title: ["すべての通知を、", "ちょうどいいものに。"]
    intro: Android 6.0 以上で、無料でダウンロードできます。
