home:
  hero:
    badge: Android のための通知マネージャー
    title: ["邪魔な通知はカット。", "大事な通知は逃さない。"]
    intro: FilterBox はすべての通知を検索できる履歴に残し、オフラインAIで迷惑通知や広告を静かに。あとはあなたのルールにおまかせです。
  history:
    eyebrow: 通知履歴
    title: ["うっかり消しても、", "履歴にちゃんと残る。"]
    intro: すべての通知を端末内に暗号化して保存。アプリやキーワードで検索し、タイムラインでさかのぼって、必要な通知はすぐに復元できます。あとから削除・送信取り消しされたメッセージも確認できます。
    points:
      - アプリ・キーワード・種類・ルールで検索
      - タイムラインで過去の日時へジャンプ
      - うっかり消した通知を復元
      - CSV で書き出して Excel などで分析
  rules:
    eyebrow: カスタムルール
    title: ["ルールを決めれば、", "あとは自動で。"]
    intro: アプリ、キーワード、時間帯、端末の状態を選んで、どう処理するかを決めるだけ。宣伝通知は消す、仕事のチャットは夜だけミュート、家族からの連絡は着信のように鳴らす、配達の通知は読み上げる。
  ai:
    eyebrow: オフラインAIフィルター
    title: ["何が迷惑かは、", "あなたが決める。"]
    intro: すべての通知を端末上でリアルタイムに判定し、内容はどこにも送信しません。「スパムです」「正常です」と教えるだけで、スマホの待機中や充電中にこっそり学習して、使うほどあなた好みに。
    points:
      - 完全オフライン、端末内で動作
      - マークした通知から学習
  enhancers:
    eyebrow: 便利機能
    title: ["小さな機能が、", "毎日をラクに。"]
    intro: 必要なものだけオンに。どれも日々のちょっとしたストレスを解消します。
    cards:
      recall:
        title: 消去の取り消し
        text: うっかり通知をスワイプしても大丈夫。5 秒間「元に戻す」ボタンが表示されます。
      shh:
        title: スマートミュート
        text: 同じアプリから短時間に通知が続くと、しばらく自動でミュート。盛り上がるグループチャットもこれで静かに。
      captcha:
        title: 認証コードのコピー
        text: SMS やほかのアプリの認証コード通知に「コピー」ボタンを追加。スマホに標準機能がなくても安心です。
      webhook:
        title: Webhook
        text: 条件に合う通知を JSON 形式で、自分のサーバーやチャットボット、スマートホームに転送します。
    more: "ほかにも：ホーム画面ウィジェット · 指紋／顔認証ロック · テーマ · ルールのインポート／エクスポート · アプリの除外"
  analytics:
    eyebrow: 通知の分析
    title: ["通知が多いアプリが、", "ひと目でわかる。"]
    intro: 直近の概要と日別のグラフで、どのアプリがよく通知してくるか、FilterBox がどれだけフィルタしたかを確認。次に対策すべきアプリが見えてきます。
  privacy:
    eyebrow: プライバシー
    title: ["あなたの通知は、", "あなたのスマホの中だけに。"]
    items:
      - title: 端末内で暗号化保存
        text: 通知履歴は端末内にのみ保存され、アップロードされることはありません。
      - title: オフラインで動く AI
        text: 判定も学習も、すべて端末内で完結します。
      - title: 指紋・顔認証ロック
        text: 通知履歴は、あなただけが見られます。
  closing:
    title: ["すべての通知を、", "ちょうどいいものに。"]
