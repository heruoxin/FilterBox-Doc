brand: FilterBox
store_name: AIで通知履歴管理：フィルターボックス

meta:
  title: FilterBox｜Android の通知履歴・AI 迷惑通知フィルター
  description: FilterBox（フィルターボックス）は Android の通知管理アプリ。すべての通知を検索できる履歴に保存し、うっかり消した通知や送信取り消しされたメッセージも確認できます。オフラインAIが迷惑通知・広告通知を自動でフィルタリングし、ミュート・延期・読み上げ・転送のルールも作れます。
  image_alt: FilterBox · 邪魔な通知はカット。大事な通知は逃さない。
  keywords: FilterBox, フィルターボックス, 通知履歴, 通知 管理 アプリ, 迷惑通知 ブロック, 広告通知 消す, 通知 復元, 送信取り消し 確認, 認証コード コピー, Android 通知
  features:
    - 検索できる通知履歴
    - 消した通知の復元、送信取り消しされたメッセージの確認
    - オフライン AI 迷惑通知フィルター
    - 通知を消去・ミュート・延期・置き換え・読み上げ・転送するルール
    - 消去の取り消し、スマートミュート、認証コードのコピー、Webhook
    - 通知の分析と CSV 書き出し

