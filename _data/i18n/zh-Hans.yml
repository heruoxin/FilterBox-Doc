      - 国内版：支持支付宝、微信购买订阅版或终身版。
      - 购买 48 小时内可申请退款。
    more: 查看购买说明
  faq:
    title: ["有疑问？", "这里有答案。"]
    more: 进入帮助中心
    items:
      - q: 通知滤盒免费吗？
        a: 免费下载，通知历史记录永久免费。首次安装可以免费试用全部高级功能；试用结束后，自定义规则、AI 过滤和通知增强等高级功能需要购买高级版。
      - q: 通知滤盒会上传我的通知吗？
        a: 不会。通知历史只在手机本地加密存储，AI 过滤也完全离线运行。通知滤盒联网仅用于购买验证，以及在你允许时发送崩溃统计，可以在设置中关闭。
      - q: 误删的通知、被撤回的消息能找回吗？
        a: 可以。通知滤盒会在通知到达时保存一份，即使你划掉了它，或者对方删除、撤回了消息，原始通知依然留在历史记录里。它只能看到通知里显示过的内容。
      - q: AI 骚扰过滤是怎么学习的？
        a: 每条通知都会在手机上得到一个骚扰指数。点开任意通知，选择「是骚扰通知」或「是正常通知」进行投喂，通知滤盒会在手机闲置或充电时学习。过滤阈值（默认 80%）和生效的 App 都可以自己设置。AI 过滤需要 Android 10 及以上、内存大于 6 GB 的手机。
      - q: 为什么用着用着就失效了？
        a: 多半是手机系统阻止了通知滤盒在后台运行。请在系统设置和多任务界面中允许它后台运行、开机自启，并加入电池优化白名单。各品牌手机的设置方法可以参考 dontkillmyapp.com。
      - q: 为什么有些通知显示「已隐藏敏感通知内容」？
        a: "从 Android 15 开始，系统会对第三方 App 隐藏可能包含验证码的通知。关闭「系统设置 → 通知 → 增强型通知」即可；也可以执行 ADB 命令：adb shell appops set com.catchingnow.np RECEIVE_SENSITIVE_NOTIFICATIONS allow"
      - q: 能清除划不掉的「固定通知」吗？
        a: 可以，需要 Android 8.0 及以上版本。在规则的「消除」效果中开启「包括固定通知」；部分原生系统还需要在系统设置中允许通知暂停。
      - q: 直接安装 APK 后，无法开启通知使用权？
        a: Android 13 及以上版本会限制非应用商店安装的 App。请进入「设置 → 应用 → 通知滤盒」，点右上角菜单选择「允许受限制的设置」，再重新开启通知使用权。
  closing:
    title: ["让每一条通知，", "都恰到好处。"]
    intro: 免费下载，支持 Android 6.0 及以上版本。
