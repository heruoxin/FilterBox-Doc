home:
  hero:
    badge: 安卓通知管家
    title: ["滤掉打扰，", "一条不漏。"]
    intro: 通知滤盒把每一条通知存进可搜索的历史记录，用离线 AI 挡住骚扰和广告，其余的交给你自己的规则。
  history:
    eyebrow: 通知历史
    title: ["手滑划掉了？", "历史里都在。"]
    intro: 每一条通知都加密保存在手机本地。按 App 或关键字搜索，沿时间轴回溯，需要时一键恢复——事后被删除、被撤回的消息也能看到。
    points:
      - 按 App、关键字、类型或规则搜索
      - 沿时间轴回溯到任意一天
      - 恢复误删的通知
      - 导出 CSV，用 Excel、WPS 分析
  rules:
    eyebrow: 自定义规则
    title: ["你的规则，", "你的通知。"]
    intro: 选好 App、关键字、时间段或手机状态，再决定怎么处理：消除推广、下班后静音工作群、家人消息像来电一样响铃、快递通知自动朗读。
  ai:
    eyebrow: 离线 AI 过滤
    title: ["什么算骚扰，", "你说了算。"]
    intro: 每条通知都在手机上实时打分，不上传任何内容。告诉它「是骚扰」还是「是正常」，它会在手机闲置或充电时悄悄学习，越用越懂你。
    points:
      - 完全离线，在手机本地运行
      - 从你标记的每一条通知中学习
  enhancers:
    eyebrow: 通知增强
    title: ["小功能，", "天天用得上。"]
    intro: 按需开启，每一个都解决一件日常小烦恼。
    cards:
      recall:
        title: 消除撤回
        text: 手滑划掉了通知？通知栏会出现一个 5 秒钟的恢复按钮。
      shh:
        title: 智能静音
        text: 某个 App 短时间内通知太频繁，就自动静音一会儿。热闹的群聊再也吵不到你。
      captcha:
        title: 验证码提取
        text: 为短信和其他 App 的验证码通知加上「复制」按钮，手机没有自带这个功能也不怕。
      webhook:
        title: Webhook
        text: 把符合规则的通知以 JSON 格式转发到你的服务器、聊天机器人或智能家居。
    more: 还有：桌面小部件 · 指纹/面容锁 · 多款主题 · 规则导入导出 · 排除 App
  analytics:
    eyebrow: 通知分析
    title: ["谁最爱打扰你，", "一目了然。"]
    intro: 近期一览和日报图表告诉你哪些 App 通知最多、通知滤盒帮你过滤了多少。接下来该管住谁，心里有数。
  privacy:
    eyebrow: 隐私
    title: ["你的通知，", "只留在你的手机里。"]
    items:
      - title: 本地加密存储
        text: 通知历史只保存在你的设备上，从不上传。
      - title: 完全离线的 AI
        text: 打分和学习全部在手机本地完成。
      - title: 指纹与面容锁
        text: 你的通知记录，只有你能看。
      - title: 极少联网
        text: 仅用于购买验证，以及可以关闭的崩溃统计。
  closing:
    title: ["让每一条通知，", "都恰到好处。"]
