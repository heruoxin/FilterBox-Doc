meta:
  title: 通知滤盒 · 安卓通知历史记录与 AI 骚扰通知过滤
  description: 通知滤盒（FilterBox）是一款安卓通知管理 App：完整保存通知历史，误删的通知、被撤回的消息都能找回；离线 AI 自动过滤骚扰和广告通知；自定义规则自动静音、推迟、朗读或转发通知。
  image_alt: 通知滤盒 · 滤掉打扰，一条不漏。
  keywords: 通知滤盒, FilterBox, 通知历史记录, 安卓通知管理, 屏蔽广告通知, 骚扰通知过滤, 查看撤回消息, 恢复误删通知, 验证码提取, 通知转发
  features:
    - 可搜索的通知历史记录
    - 恢复误删的通知，查看被撤回的消息
    - 离线 AI 骚扰通知过滤
    - 自定义规则：消除、静音、推迟、替换、朗读、转发通知
    - 消除撤回、智能静音、验证码提取与 Webhook
    - 通知分析与 CSV 导出

