home:
  hero:
    badge: Notification manager for Android
    title: ["Filter the noise.", "Never miss a thing."]
    intro: FilterBox keeps every notification in a searchable history, quiets spam and ads with on-device AI, and lets your own rules handle the rest.
  history:
    eyebrow: Notification history
    title: ["Swiped it away?", "It's still here."]
    intro: Every notification is saved to an encrypted history on your phone. Search by app or keyword, scrub through time, and bring back what you need — even messages that were later deleted or recalled.
    points:
      - Search by app, keyword, type or rule
      - Scrub through days on the timeline
      - Restore dismissed notifications
      - Export to CSV for Excel or Sheets
  rules:
    eyebrow: Custom rules
    title: ["Your rules.", "Your notifications."]
    intro: Pick apps, keywords, times or phone states, then decide what happens. Dismiss promos, mute work chats after hours, ring like a call when family texts, or have deliveries read aloud.
  ai:
    eyebrow: Offline AI filter
    title: ["Learns what spam", "means to you."]
    intro: FilterBox scores every notification right on your phone — nothing is uploaded. Mark one as spam or normal and it learns, quietly retraining while your phone is idle or charging.
    points:
      - Runs fully offline, on your phone
      - Learns from every notification you mark
  enhancers:
    eyebrow: Enhancers
    title: ["Small extras.", "Everyday wins."]
    intro: Turn on what you like. Each one solves a small daily annoyance.
    cards:
      recall:
        title: Dismissal Recall
        text: Swiped a notification away by mistake? An Undo button stays on screen for 5 seconds.
      shh:
        title: Smart Shh
        text: When one app fires off notifications too fast, FilterBox mutes it for a while. Perfect for lively group chats.
      captcha:
        title: Code Copy
        text: Adds a one-tap Copy button to verification codes in SMS and other apps, if your phone doesn't already.
      webhook:
        title: Webhook
        text: Forward matching notifications as JSON to your own server, chat bot or home automation.
    more: "Also included: home screen widgets · fingerprint & face lock · themes · rule import and export · exclusions"
  analytics:
    eyebrow: Analytics
    title: ["See who keeps", "interrupting you."]
    intro: Recent and daily charts show which apps notify the most and how much FilterBox has filtered — so you know what to tame next.
  privacy:
    eyebrow: Privacy
    title: ["Your notifications", "stay on your phone."]
    items:
      - title: Encrypted local history
        text: Stored only on your device and never uploaded.
      - title: AI that stays offline
        text: Scoring and learning run entirely on your phone.
      - title: Fingerprint & face lock
        text: Keep your notification history to yourself.
      - title: Minimal network use
        text: Only purchase verification and optional crash reports, which you can turn off.
  closing:
    title: ["Make every", "notification count."]
