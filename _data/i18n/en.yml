home:
  hero:
    badge: Notification manager for Android
    title: ["Filter the noise.", "Never miss a thing."]
    intro: FilterBox keeps every notification in a searchable history, quiets spam and ads with on-device AI, and lets your own rules handle the rest.
    hint: Try it — swipe a notification away
  history:
    eyebrow: Notification history
    title: ["Swiped it away?", "It's still here."]
    intro: Every notification is saved to an encrypted history on your phone. Search by app or keyword, scrub through time, and bring back what you need — even messages that were later deleted or recalled.
    points:
      - Search by app, keyword, type or rule
      - Scrub through days on the timeline
      - Restore dismissed notifications
      - Export to CSV for Excel or Sheets
    hint: Drag the timeline or tap a card
  rules:
    eyebrow: Custom rules
    title: ["Your rules.", "Your notifications."]
    intro: Pick apps, keywords, times or phone states, then decide what happens. Dismiss promos, mute work chats after hours, ring like a call when family texts, or have deliveries read aloud.
    pick: Pick an action
    community: Need ideas? Browse rules shared by the community
  ai:
    eyebrow: Offline AI filter
    title: ["Learns what spam", "means to you."]
    intro: FilterBox scores every notification right on your phone — nothing is uploaded. Mark one as spam or normal and it learns, quietly retraining while your phone is idle or charging. One slider sets how strict it is.
    points:
      - Runs fully offline, on your phone
      - Learns from every notification you mark
      - You set the threshold and the apps it covers
    note: The AI filter requires Android 10 or later and a phone with more than 6 GB of RAM.
  enhancers:
    eyebrow: Enhancers
    title: ["Small extras.", "Everyday wins."]
    intro: Turn on what you like. Each one solves a small daily annoyance.
    cards:
      recall:
        title: Dismissal Recall
        text: Swiped a notification away by mistake? An Undo button stays on screen for 5 seconds.
      shh:
        title: Smart Shh
        text: When one app fires off notifications too fast, FilterBox mutes it for a while. Perfect for lively group chats.
      captcha:
        title: Code Copy
        text: Adds a one-tap Copy button to verification codes in SMS and other apps, if your phone doesn't already.
      webhook:
        title: Webhook
        text: Forward matching notifications as JSON to your own server, chat bot or home automation.
    more: "Also included: home screen widgets · fingerprint & face lock · themes · rule import and export · exclusions"
  analytics:
    eyebrow: Analytics
    title: ["See who keeps", "interrupting you."]
    intro: Recent and daily charts show which apps notify the most and how much FilterBox has filtered — so you know what to tame next.
  privacy:
    eyebrow: Privacy
    title: ["Your notifications", "stay on your phone."]
    items:
      - title: Encrypted local history
        text: Stored only on your device and never uploaded.
      - title: AI that stays offline
        text: Scoring and learning run entirely on your phone.
      - title: Fingerprint & face lock
        text: Keep your notification history to yourself.
      - title: Minimal network use
        text: Only purchase verification and optional crash reports, which you can turn off.
  pricing:
    eyebrow: Pricing
    title: ["Free to start.", "Pro when you're ready."]
    intro: Try every Pro feature free when you first install FilterBox.
    free:
      name: Free
      price: $0
      note: The essentials, forever
      features:
        - Notification history
        - Search, timeline and restore
        - Free trial of every Pro feature
    pro:
      name: Pro
      price: One-time purchase
      note: Everything, for good
      badge: Best value
      features:
        - Custom rules with every action
        - Offline AI spam filter
        - Dismissal Recall, Smart Shh and Webhook
        - Analytics and CSV export
        - Longer history storage
        - All future features included
    notes:
      - Google Play — lifetime purchase, on every device signed in to your Google account.
      - Mainland China — Alipay or WeChat Pay, subscription or lifetime.
      - Refunds within 48 hours of purchase.
    more: Purchase details
  faq:
    title: ["Questions,", "answered."]
    more: Visit the Help Center
    items:
      - q: Is FilterBox free?
        a: Yes. FilterBox is free to download and its notification history stays free forever. You can try every Pro feature free after installing; afterwards, custom rules, the AI filter and enhancers need a one-time Pro purchase.
      - q: Does FilterBox upload my notifications?
        a: No. Your notification history is stored encrypted on your phone and the AI filter runs fully offline. FilterBox only goes online to verify purchases and, if you allow it, to send crash reports, which you can turn off in Settings.
      - q: Can I see notifications I dismissed, or messages that were recalled?
        a: Yes. FilterBox saves each notification as it arrives, so the original stays in your history even after you swipe it away or the sender deletes or recalls the message. It can only show what was in the notification itself.
      - q: How does the AI spam filter learn?
        a: Each notification gets a spam score on your device. Open any notification and tap “It is spam” or “It is normal” to teach it; FilterBox learns from your feedback while the phone is idle or charging. You choose the threshold (80% by default) and which apps it covers. The AI filter needs Android 10 or later and more than 6 GB of RAM.
      - q: Why does FilterBox stop working after a while?
        a: Your phone's battery management is most likely stopping it in the background. Allow FilterBox to run in the background and start automatically, and turn off battery optimization for it. dontkillmyapp.com has steps for each phone brand.
      - q: Why do some notifications say “Sensitive notification content hidden”?
        a: "Since Android 15, the system hides notifications that may contain one-time codes from third-party apps. Turn off Settings → Notifications → Enhanced notifications, or run: adb shell appops set com.catchingnow.np RECEIVE_SENSITIVE_NOTIFICATIONS allow"
      - q: Can FilterBox remove persistent notifications?
        a: Yes, on Android 8.0 and later. Turn on “Include fixed notifications” in a rule's Dismiss action. On some phones you also need to allow notification snoozing in system settings.
      - q: I installed the APK but can't turn on notification access.
        a: Android 13 and later restricts sideloaded apps. Go to Settings → Apps → FilterBox, tap ⋮ in the top-right corner, choose “Allow restricted settings”, then turn on notification access again.
  closing:
    title: ["Make every", "notification count."]
    intro: Free to download for Android 6.0 and later.
