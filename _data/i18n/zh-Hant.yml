        - 免費試用所有進階功能
    pro:
      name: 進階版
      price: 一次購買
      note: 完整功能，長期擁有
      badge: 推薦
      features:
        - 自訂規則與所有規則效果
        - 離線 AI 垃圾通知過濾
        - 清除後復原、智慧靜音與 Webhook
        - 通知分析與 CSV 匯出
        - 更長的紀錄保存時間
        - 之後的新功能不需再付費
    notes:
      - Google Play：終身版一次購買，同一個 Google 帳戶的裝置都能使用。
      - 中國大陸版：支援支付寶、微信支付購買訂閱版或終身版。
      - 購買後 48 小時內可申請退款。
    more: 查看購買說明
  faq:
    title: ["有疑問嗎？", "這裡有答案。"]
    more: 前往說明中心
    items:
      - q: 通知濾盒免費嗎？
        a: 免費下載，通知紀錄永久免費。首次安裝可以免費試用所有進階功能；試用結束後，自訂規則、AI 過濾與通知強化等進階功能需要購買進階版。
      - q: 通知濾盒會上傳我的通知嗎？
        a: 不會。通知紀錄只在手機上加密儲存，AI 過濾也完全離線執行。通知濾盒連網僅用於購買驗證，以及在你同意時傳送當機回報，可以在設定中關閉。
      - q: 不小心滑掉的通知、被收回的訊息找得回來嗎？
        a: 可以。通知濾盒會在通知送達時保存一份，就算你把它滑掉，或對方刪除、收回了訊息，原始通知依然留在紀錄裡。它只看得到通知裡顯示過的內容。
      - q: AI 垃圾通知過濾是怎麼學習的？
        a: 每則通知都會在手機上得到一個垃圾指數。點開任一則通知，選擇「是垃圾通知」或「是正常通知」來教它，通知濾盒會在手機閒置或充電時學習。過濾門檻（預設 80%）和適用的 App 都能自己設定。AI 過濾需要 Android 10 以上、記憶體大於 6 GB 的手機。
      - q: 為什麼用一陣子就失效了？
        a: 多半是手機系統把通知濾盒在背景關閉了。請在系統設定與多工畫面中允許它在背景執行、開機自動啟動，並關閉電池最佳化。各品牌手機的設定方式可以參考 dontkillmyapp.com。
      - q: 為什麼有些通知顯示「已隱藏敏感通知內容」？
        a: "從 Android 15 開始，系統會對第三方 App 隱藏可能含有驗證碼的通知。關閉「設定 → 通知 → 加強型通知」即可；也可以執行 ADB 指令：adb shell appops set com.catchingnow.np RECEIVE_SENSITIVE_NOTIFICATIONS allow"
      - q: 能清除滑不掉的常駐通知嗎？
        a: 可以，需要 Android 8.0 以上版本。在規則的「清除」效果中開啟「包含常駐通知」；部分原生系統還需要在系統設定中允許延後通知。
      - q: 直接安裝 APK 後，無法開啟通知存取權？
        a: Android 13 以上會限制不是從應用程式商店安裝的 App。請前往「設定 → 應用程式 → 通知濾盒」，點右上角選單並選擇「允許受限制的設定」，再重新開啟通知存取權。
  closing:
    title: ["讓每一則通知，", "都恰到好處。"]
    intro: 免費下載，支援 Android 6.0 以上版本。
