home:
  hero:
    badge: Android 通知管家
    title: ["濾掉打擾，", "一則不漏。"]
    intro: 通知濾盒把每一則通知存進可搜尋的紀錄，用離線 AI 擋下垃圾與廣告通知，其餘交給你自己的規則。
    hint: 試試看：把一則通知滑掉
  history:
    eyebrow: 通知紀錄
    title: ["不小心滑掉了？", "紀錄裡都還在。"]
    intro: 每一則通知都加密保存在手機裡。依 App 或關鍵字搜尋，沿著時間軸回顧，需要時一鍵還原——事後被刪除、被收回的訊息也看得到。
    points:
      - 依 App、關鍵字、類型或規則搜尋
      - 沿著時間軸回到任何一天
      - 還原不小心滑掉的通知
      - 匯出 CSV，用 Excel 或試算表分析
    hint: 拖曳右側時間軸，或點開一則通知
  rules:
    eyebrow: 自訂規則
    title: ["你的規則，", "你的通知。"]
    intro: 選好 App、關鍵字、時段或手機狀態，再決定怎麼處理：清除促銷推播、下班後把工作群組靜音、家人的訊息像來電一樣響鈴、包裹通知自動朗讀。
    pick: 選擇一種規則效果
    community: 沒有靈感？看看大家分享的規則
  ai:
    eyebrow: 離線 AI 過濾
    title: ["什麼算垃圾通知，", "你說了算。"]
    intro: 每則通知都在手機上即時評分，不上傳任何內容。告訴它「是垃圾」還是「是正常」，它會在手機閒置或充電時默默學習，越用越懂你。過濾要多嚴格，一個滑桿就能調整。
    points:
      - 完全離線，在手機上執行
      - 從你標記的每一則通知學習
      - 過濾門檻與適用 App 由你決定
    note: AI 過濾需要 Android 10 以上，且手機記憶體大於 6 GB。
  enhancers:
    eyebrow: 通知強化
    title: ["小功能，", "天天用得到。"]
    intro: 依需要開啟，每一個都解決一件日常小煩惱。
    cards:
      recall:
        title: 清除後復原
        text: 不小心把通知滑掉了？通知列會出現一個 5 秒鐘的復原按鈕。
      shh:
        title: 智慧靜音
        text: 某個 App 短時間內通知太頻繁，就自動靜音一陣子。熱鬧的群組再也吵不到你。
      captcha:
        title: 驗證碼複製
        text: 為簡訊和其他 App 的驗證碼通知加上「複製」按鈕，就算手機沒有內建也沒關係。
      webhook:
        title: Webhook
        text: 把符合規則的通知以 JSON 格式轉寄到你的伺服器、聊天機器人或智慧家庭。
    more: 還有：桌面小工具 · 指紋／臉部解鎖 · 多款主題 · 規則匯入匯出 · 排除 App
  analytics:
    eyebrow: 通知分析
    title: ["誰最常打擾你，", "一目了然。"]
    intro: 近期總覽與每日圖表告訴你哪些 App 通知最多、通知濾盒幫你過濾了多少。下一個該管住誰，一清二楚。
