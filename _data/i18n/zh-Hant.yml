      - title: 完全離線的 AI
        text: 評分與學習全部在手機上完成。
      - title: 指紋與臉部解鎖
        text: 你的通知紀錄，只有你看得到。
      - title: 極少連網
        text: 僅用於購買驗證，以及可以關閉的當機回報。
