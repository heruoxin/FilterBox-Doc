brand: 通知濾盒
store_name: 通知濾盒 FilterBox Notification Manager

meta:
  title: 通知濾盒 · Android 通知紀錄與 AI 垃圾通知過濾
  description: 通知濾盒（FilterBox）是 Android 通知管理 App：完整保存通知紀錄，不小心滑掉的通知、被收回的訊息都找得回來；離線 AI 自動過濾垃圾與廣告通知；自訂規則自動靜音、延後、朗讀或轉寄通知。
  image_alt: 通知濾盒 · 濾掉打擾，一則不漏。
  keywords: 通知濾盒, FilterBox, 通知紀錄, Android 通知管理, 封鎖廣告通知, 垃圾通知過濾, 查看收回訊息, 還原通知, 驗證碼, 通知轉寄
  features:
    - 可搜尋的通知紀錄
    - 還原滑掉的通知，查看被收回的訊息
    - 離線 AI 垃圾通知過濾
    - 自訂規則：清除、靜音、延後、取代、朗讀、轉寄通知
    - 清除後復原、智慧靜音、驗證碼複製與 Webhook
    - 通知分析與 CSV 匯出

